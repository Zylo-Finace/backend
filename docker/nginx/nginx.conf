# =============================================================================
#  Reverse proxy for the WhatsApp Business Platform API.
#
#  Responsibilities that belong at the edge rather than in the app:
#   - TLS termination
#   - coarse connection/rate limiting (cheap defence before Node burns a worker)
#   - blocking operational endpoints from the public internet
#   - WebSocket upgrade for Socket.IO
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  # ---------------------------------------------------------------------------
  # Logging — JSON so the same shipper handles nginx and application logs, and
  # `request_id` correlates an edge log line with the application trace.
  # ---------------------------------------------------------------------------
  log_format json_combined escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"'
  '}';

  access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;
  error_log  /var/log/nginx/error.log warn;

  # ---------------------------------------------------------------------------
  # Transport
  # ---------------------------------------------------------------------------
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65s;
  keepalive_requests 1000;
  reset_timedout_connection on;
  server_tokens   off;

  client_max_body_size 20m;      # WhatsApp media ceiling; app enforces per-type limits
  client_body_timeout  30s;
  client_header_timeout 15s;
  large_client_header_buffers 4 16k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript text/plain text/css application/xml;

  # ---------------------------------------------------------------------------
  # Rate limiting
  #
  # Coarse and IP-based — the real per-tenant, per-plan limits live in the
  # application where the tenant is known. This tier exists so a flood costs
  # nginx a few microseconds instead of costing Node a request cycle.
  # ---------------------------------------------------------------------------
  limit_req_zone  $binary_remote_addr zone=api_limit:20m   rate=100r/s;
  limit_req_zone  $binary_remote_addr zone=auth_limit:10m  rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream wabot_api {
    least_conn;
    # `server api:3000` resolves to all Compose replicas; in Kubernetes this is
    # the Service DNS name.
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
    keepalive_timeout 60s;
  }

  # Redirect all plaintext traffic. HSTS is set by the application.
  server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    limit_conn conn_limit 100;

    # Shared proxy configuration.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";
    proxy_buffering on;
    proxy_buffers 16 16k;

    # ---------------------------------------------------------------------------
    # Meta webhooks — highest-priority path.
    #
    # No rate limit: Meta retries aggressively and treats slow or throttled
    # responses as failures, eventually disabling the subscription. Throughput
    # protection happens by acknowledging fast and processing on a queue.
    # ---------------------------------------------------------------------------
    location /api/v1/webhooks/whatsapp {
      proxy_pass http://wabot_api;
      proxy_read_timeout 10s;
      proxy_send_timeout 10s;
      # Signature verification needs the byte-exact body; never let nginx alter it.
      proxy_request_buffering on;
    }

    # Credential endpoints get a much tighter bucket than the rest of the API.
    location ~ ^/api/v[0-9]+/auth/(login|register|forgot-password|reset-password) {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://wabot_api;
      proxy_read_timeout 30s;
    }

    location /api/ {
      limit_req zone=api_limit burst=200 nodelay;
      proxy_pass http://wabot_api;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Socket.IO — needs the upgrade headers and a long read timeout, since an
    # idle websocket legitimately sends nothing for minutes.
    location /socket.io/ {
      proxy_pass http://wabot_api;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Load-balancer health probe. Not rate limited, not logged.
    location = /health/ready {
      access_log off;
      proxy_pass http://wabot_api;
    }

    # ---------------------------------------------------------------------------
    # Operational endpoints — private networks only.
    #
    # `/metrics` exposes internal topology and traffic shape; `/docs` is a map of
    # every endpoint and field. Neither belongs on the public internet.
    # ---------------------------------------------------------------------------
    location /metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      access_log off;
      proxy_pass http://wabot_api;
    }

    location /docs {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://wabot_api;
    }

    location / {
      return 404 '{"success":false,"error":{"code":"ROUTE_NOT_FOUND","message":"Not found","retryable":false}}';
    }
  }
}
